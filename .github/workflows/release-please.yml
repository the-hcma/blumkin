# Release Please turns Conventional Commits on main into a release PR; merging
# that PR tags the release and publishes the distributions to PyPI with OIDC
# trusted publishing. See docs/RELEASING.md and SECURITY.md. Nobody hand-edits
# the version. Modeled on the-hcma/repository-helpers' release-please setup.

name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_publish_pypi:
        description: >-
          Force the Publish PyPI job to run even though Release Please
          didn't report release_created=true this run. Escape hatch for
          when release-please's component-matching breaks on an
          already-merged, already-tagged manual release (see #337); the
          job still builds off whatever pyproject.toml/tag main has, so
          only run this right after confirming the intended version is
          tagged.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr: ${{ steps.release.outputs.pr }}
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pi_release_created: ${{ steps.release.outputs['integrations/pi--release_created'] }}
      pi_tag_name: ${{ steps.release.outputs['integrations/pi--tag_name'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Assert Release Please acted on releasable commits
        if: github.event_name == 'push'
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
          PI_RELEASE_CREATED: ${{ steps.release.outputs['integrations/pi--release_created'] }}
        run: |
          commit_title=$(git log -1 --format='%s' "$COMMIT_SHA")
          if echo "$commit_title" | grep -qE '^(feat|fix)(\([^)]*\))?!?:' && \
             [[ "$RELEASE_CREATED" != "true" ]] && \
             [[ -z "$RELEASE_PR" ]] && \
             [[ "$PI_RELEASE_CREATED" != "true" ]]; then
            echo "ERROR: Commit '$commit_title' is releasable, but Release Please neither cut a release nor opened or updated a release PR (root or integrations/pi)." >&2
            echo "Check the commit format and that squash_merge_commit_message=BLANK is configured on the repo." >&2
            exit 1
          fi

  resolve-release-pr:
    name: Resolve release PR
    needs: release-please
    if: >-
      always() &&
      needs.release-please.result == 'success' &&
      needs.release-please.outputs.pr != '' &&
      needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Resolve release PR commits
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_JSON: ${{ needs.release-please.outputs.pr }}
        run: |
          set -euo pipefail
          pr_number=$(jq -r '.number' <<<"$RELEASE_PR_JSON")
          head_sha=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          head_ref=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)
          base_sha=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json baseRefOid --jq .baseRefOid)
          {
            echo "base_sha=${base_sha}"
            echo "head_ref=${head_ref}"
            echo "head_sha=${head_sha}"
          } >>"$GITHUB_OUTPUT"

  update-uv-lock:
    name: Update uv.lock
    needs: [release-please, resolve-release-pr]
    if: >-
      always() &&
      needs.resolve-release-pr.result == 'success' &&
      needs.release-please.outputs.pr != '' &&
      needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      head_sha: ${{ steps.push.outputs.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release-pr.outputs.head_sha }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest

      - name: Regenerate uv.lock
        run: uv lock

      - name: Commit and push if changed
        id: push
        shell: bash
        env:
          HEAD_REF: ${{ needs.resolve-release-pr.outputs.head_ref }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [[ -z "$(git status --porcelain=v1)" ]]; then
            echo "No lockfile changes."
            echo "head_sha=${head_sha}" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: update uv.lock"
          git push origin "HEAD:refs/heads/${HEAD_REF}"
          echo "head_sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

  release-pr-ci:
    name: Release PR CI
    needs: [release-please, resolve-release-pr, update-uv-lock]
    if: >-
      always() &&
      needs.resolve-release-pr.result == 'success' &&
      needs.update-uv-lock.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.update-uv-lock.outputs.head_sha || needs.resolve-release-pr.outputs.head_sha }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest

      - name: Python lint & format checks
        run: bash .github/ci/python-static

      - name: Pytest (hermetic)
        run: bash .github/ci/pytest-hermetic

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck
        run: bash .github/ci/shellcheck

      - name: Packaging smoke
        run: ./test_packaging

      - name: Secret Scan
        env:
          GITLEAKS_BASE: ${{ needs.resolve-release-pr.outputs.base_sha }}
          GITLEAKS_HEAD: ${{ needs.update-uv-lock.outputs.head_sha || needs.resolve-release-pr.outputs.head_sha }}
        run: bash .github/ci/secret-scan

  publish-npm:
    name: Publish npm (pi skill)
    needs: release-please
    if: ${{ needs.release-please.outputs.pi_release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: integrations/pi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        run: npm publish --access public

  publish-pypi:
    name: Publish PyPI (${{ matrix.os }})
    needs: release-please
    if: >-
      ${{ needs.release-please.outputs.release_created == 'true' ||
      github.event.inputs.force_publish_pypi == 'true' }}
    # Two legs, one release: ubuntu-latest builds the sdist plus a
    # `py3-none-any` wheel (everyone else); macos-14 builds a second,
    # macOS-tagged wheel bundling the compiled `blumkin-agent` binary
    # (issue #328 - see hatch_build.py). `--wheel`/`--sdist` keep each leg
    # from re-uploading the identical sdist filename twice.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_args: --sdist --wheel
            verify: true
          - os: macos-14
            build_args: --wheel
            verify: false
    runs-on: ${{ matrix.os }}
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest

      - name: Set up Python 3.14
        run: uv python install 3.14

      # Both Apple Silicon and Intel targets so hatch_build.py can `lipo`
      # a true universal2 blumkin-agent binary, not the native-arch-only
      # fallback it uses on a bare `brew install rust` dev machine.
      - name: Install Rust toolchain
        if: matrix.os == 'macos-14'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: uv sync --group dev

      - name: Embed build metadata
        run: |
          version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          export BLUMKIN_EMBED_VERSION="${version}"
          export BLUMKIN_EMBED_COMMIT="${GITHUB_SHA}"
          uv run python scripts/embed_build_metadata

      - name: Build distributions
        # macOS must stay `--wheel`-only: if this ever grows an `--sdist`
        # leg, both jobs would try to publish the identical
        # `blumkin-<version>.tar.gz` and one would fail on the duplicate
        # filename (see PR #331 review).
        run: uv build ${{ matrix.build_args }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Verify PyPI release
        if: matrix.verify
        run: |
          version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          ./scripts/verify-pypi-release "$version"
