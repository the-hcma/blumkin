version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 10
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 10
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      # kiota-http >=1.13.0 breaks msgraph-core's AsyncGraphTransport (.me calls 404);
      # mirrors the cap in pyproject.toml and .dep-updater-acked-caps. TEMPORARY: remove
      # this, the cap, the uv constraint, the ack entry and
      # .github/workflows/kiota-http-cap-watch.yml together once msgraph-core ships the fix
      # (blumkin#387, msgraph-sdk-python-core#1128); that workflow opens an issue when it does.
      - dependency-name: "microsoft-kiota-http"
        versions: [">=1.13.0"]
