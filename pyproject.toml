[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blumkin"
version = "1.5.0"
description = "Personal Microsoft 365 / Graph skills CLI (delegated as me)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [
    { name = "Henrique Andrade", email = "thehcma@users.noreply.github.com" },
]
keywords = [
    "blumkin",
    "cli",
    "microsoft-graph",
    "outlook",
    "teams",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
]
dependencies = [
    "azure-identity>=1.25.3",
    "click>=8.5.0",
    "google-api-python-client>=2.200.0",
    "google-auth>=2.57.1",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.4.1",
    "httplib2>=0.32.0",
    "icalendar>=7.3.0",
    "mcp>=2.2.0",
    "msal>=1.38.0",
    "msgraph-sdk>=1.62.0",
    "python-docx>=1.2.0",
    "tomlkit>=0.15.1",
    # macOS Keychain is the OS-native, encrypted-at-rest credential store; on
    # macOS `keyring` is always installed (not opt-in) so tokens prefer the
    # Keychain by default instead of a plaintext file - `token_storage =
    # "auto"` still falls back to the file if no real backend is reachable
    # at runtime (locked keychain, headless session, etc.). Other platforms
    # keep it as the `keychain` extra below (see secret_store.py, issue #308).
    "keyring>=25.7.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "keyring>=25.7.0",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
# `keychain` and `mcp` are kept as no-op aliases for anyone still typing
# `pipx install 'blumkin[keychain]'` / `'blumkin[mcp]'` from older docs/scripts:
# `mcp` is now always a core dependency, and `keyring` is a core dependency on
# macOS (see `dependencies` above) and remains opt-in elsewhere.
keychain = ["keyring>=25.7.0"]
mcp = ["mcp>=2.2.0"]
ocr = ["pytesseract>=0.3", "pdf2image>=1.17", "pillow>=12.3.0"]
pdf = ["pdfplumber>=0.11.10"]
xlsx = ["openpyxl>=3.1.5"]

[project.scripts]
blumkin = "blumkin.cli:main"

[project.urls]
Changelog = "https://github.com/the-hcma/blumkin/blob/main/CHANGELOG.md"
Homepage = "https://github.com/the-hcma/blumkin"
Issues = "https://github.com/the-hcma/blumkin/issues"
Repository = "https://github.com/the-hcma/blumkin"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
# `blumkin/agent/bin/` only exists after `hatch_build.py`'s cargo build runs
# (on macOS with a Rust toolchain); on other platforms/without cargo the
# directory does not exist and this pattern simply matches nothing, which
# hatchling accepts (it is not an error for an artifact glob to be empty).
artifacts = ["src/blumkin/agent/bin/*"]

[tool.pytest.ini_options]
markers = [
    "live: live Graph read tests (needs ~/.config/blumkin and network)",
    "live_google: live Google API read tests (needs a logged-in Google profile and network); also marked 'live'",
]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "hatch_build.py"]
pythonVersion = "3.14"
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "mcp>=2.2.0",
    "keyring>=25.7.0",
    "hatchling>=1.28.0",
]
